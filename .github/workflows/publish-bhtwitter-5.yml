name: Publish BHTwitter 5.0

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/publish-bhtwitter-5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish BHTwitter 5.0 for X 12.16
    runs-on: macos-15-intel
    env:
      SOURCE_RELEASE_ASSET_ID: '514031518'
      RELEASE_TAG: 'v5.0'
      RELEASE_NAME: 'BHTwitter 5.0 - X 12.16'
      RELEASE_FILE: 'BHTwitter-sideloaded_5.0_12.16.ipa'

    steps:
      - name: Checkout BHTwitter 5.0 source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: brew install make dpkg ldid

      - name: Add GNU Make to PATH
        run: echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Download Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: master
          path: theos
          submodules: recursive

      - name: Download iOS 16.5 SDK
        run: |
          set -euo pipefail
          git clone -n --depth=1 --filter=tree:0 https://github.com/theos/sdks/ sdks
          cd sdks
          git sparse-checkout set --no-cone iPhoneOS16.5.sdk
          git checkout
          mv iPhoneOS16.5.sdk "${THEOS}/sdks/"
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Build current BHTwitter dylib
        run: |
          set -euo pipefail
          sed -i '' 's/^TARGET.*$/TARGET := iphone:clang:16.5:15.0/' Makefile
          make clean
          rm -rf .theos
          make SIDELOADED=1
          test -f .theos/obj/debug/BHTwitter.dylib
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Download X 12.16 base IPA from previous verified release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${SOURCE_RELEASE_ASSET_ID}" \
            -o base.ipa
          unzip -q base.ipa -d patched

      - name: Replace tweak with BHTwitter 5.0 build
        run: |
          set -euo pipefail

          APP_DIR="$(find patched/Payload -maxdepth 1 -type d -name '*.app' | head -n 1)"
          if [ -z "${APP_DIR}" ]; then
            echo "X app bundle not found"
            exit 1
          fi

          X_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${APP_DIR}/Info.plist")
          echo "Detected X version: ${X_VERSION}"
          if [ "${X_VERSION}" != "12.16" ]; then
            echo "Expected X 12.16 but base IPA contains ${X_VERSION}"
            exit 1
          fi

          OLD_DYLIB="$(find "${APP_DIR}" -type f -name 'BHTwitter.dylib' | head -n 1)"
          if [ -z "${OLD_DYLIB}" ]; then
            echo "Existing BHTwitter.dylib not found in base IPA"
            exit 1
          fi
          cp .theos/obj/debug/BHTwitter.dylib "${OLD_DYLIB}"

          OLD_BUNDLE="$(find "${APP_DIR}" -type d -name 'BHTwitter.bundle' | head -n 1)"
          if [ -z "${OLD_BUNDLE}" ]; then
            echo "Existing BHTwitter.bundle not found in base IPA"
            exit 1
          fi
          rm -rf "${OLD_BUNDLE}"
          cp -R "layout/Library/Application Support/BHT/BHTwitter.bundle" "${OLD_BUNDLE}"

          BHT_INFO="${OLD_BUNDLE}/Info.plist"
          if /usr/libexec/PlistBuddy -c 'Print :BHTVersion' "${BHT_INFO}" >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c 'Set :BHTVersion 5.0' "${BHT_INFO}"
          else
            /usr/libexec/PlistBuddy -c 'Add :BHTVersion string 5.0' "${BHT_INFO}"
          fi

          echo "BHTwitter version: $(/usr/libexec/PlistBuddy -c 'Print :BHTVersion' "${BHT_INFO}")"
          rm -f "${RELEASE_FILE}"
          (cd patched && zip -qry "../${RELEASE_FILE}" .)
          test -s "${RELEASE_FILE}"

      - name: Publish public GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          EXISTING_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate --jq '.[] | select(.tag_name == "v5.0") | .id' | head -n 1 || true)"
          if [ -n "${EXISTING_ID}" ]; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${EXISTING_ID}"
          fi

          TAG_REF="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.ref' 2>/dev/null || true)"
          if [ -n "${TAG_REF}" ]; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}"
          fi

          gh release create "${RELEASE_TAG}" "${RELEASE_FILE}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "master" \
            --title "${RELEASE_NAME}" \
            --notes $'## BHTwitter 5.0\n\n**Supported X version: 12.16**\n\nOfficial BHTwitter 5.0 release targeting X 12.16. Includes the current X 12.16 compatibility work and updated profile UI hooks.'

          gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}"
